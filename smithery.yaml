name: wildberries-mcp
description: Wildberries Seller API MCP server. 30 tools — products, prices, stocks, orders, sales, FBS supplies, analytics, feedbacks, questions, returns, ads, ABC analysis. Per-category host routing + rate limiting.
version: 1.0.0

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      WB_API_TOKEN:
        type: string
        description: "Wildberries Seller API token (JWT, 180-day validity). Get at https://seller.wildberries.ru/supplier-settings/access-to-api"
    required:
      - WB_API_TOKEN
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "@theyahia/wildberries-mcp"],
      env: {
        WB_API_TOKEN: config.WB_API_TOKEN
      }
    })
